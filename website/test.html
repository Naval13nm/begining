<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        * {
            background-color: #ffffff;

        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            position: relative;
            height: 100px;
            width: 100px;
            /* border: 2px solid black; */
        }

        .circle {
            z-index: 2;
        }

        .circle,
        .rings {
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid black;
            position: absolute;
        }

        .rings {
            z-index: 1;
            animation: ripple 3s linear infinite;
        }

        .ring-1 {
            animation-delay: 0s;
            background-color: aqua;

        }

        .ring-2 {
            animation-delay: 1s;
            background-color: aqua;


        }

        .ring-3 {
            animation-delay: 2s;
            transition:


        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            25% {
                transform: scale(2);
                opacity: 0.8;
            }
            50% {
                transform: scale(4);
                opacity: 0.8;
            }
            75% {
                transform: scale(6);
                opacity: 0.8;
            }

            100% {
                transform: scale(8);
                /* Grows 4 times its size */
                opacity: 0;
                /* Completely fades out */
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="circle"></div>
        <div class="rings ring-1"></div>
        <div class="rings ring-2"></div>
        <div class="rings ring-3"></div>
    </div>
</body>

</html>
